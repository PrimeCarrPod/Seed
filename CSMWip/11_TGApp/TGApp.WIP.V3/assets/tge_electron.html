<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TGE E1 - Prime Electron Worldline 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0A0A0F; 
            color: #E8E8F0; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        #canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        #hud { 
            position: absolute; 
            top: 60px; 
            left: 20px; 
            right: 20px; 
            bottom: 80px; 
            pointer-events: none; 
            z-index: 10; 
        }
        .hud-panel { 
            background: rgba(26, 26, 46, 0.9); 
            border: 1px solid #00D4AA; 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 10px; 
            font-size: 11px; 
            line-height: 1.6; 
        }
        .hud-title { 
            color: #00D4AA; 
            font-weight: bold; 
            margin-bottom: 8px; 
            border-bottom: 1px solid #00D4AA44; 
            padding-bottom: 4px; 
        }
        .stat-row { 
            display: flex; 
            justify-content: space-between; 
            margin: 4px 0; 
        }
        .stat-label { color: #8888A0; }
        .stat-value { color: #00D4AA; font-weight: bold; }
        #menu-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(10, 10, 15, 0.95); 
            z-index: 100; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
        }
        #menu-overlay.visible { display: flex; }
        .menu-btn { 
            background: #1A1A2E; 
            border: 1px solid #00D4AA; 
            color: #00D4AA; 
            padding: 16px 48px; 
            font-size: 18px; 
            font-family: inherit; 
            border-radius: 8px; 
            min-width: 280px; 
        }
        .menu-btn:hover, .menu-btn:focus { background: #00D4AA; color: #0A0A0F; }
        .menu-btn.danger { border-color: #FF4466; color: #FF4466; }
        .menu-btn.danger:hover { background: #FF4466; color: #0A0A0F; }
        .menu-btn.secondary { border-color: #A855F7; color: #A855F7; }
        .menu-btn.secondary:hover { background: #A855F7; color: #0A0A0F; }
        .menu-title { font-size: 28px; color: #00D4AA; margin-bottom: 20px; }
        .menu-subtitle { color: #8888A0; font-size: 12px; }
        #renderer-type { color: #F97316; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">
        <div class="hud-panel">
            <div class="hud-title">PRIME ELECTRON WORLDLINE 3D</div>
            <div class="stat-row"><span class="stat-label">Renderer:</span><span class="stat-value" id="renderer-type">WebGL</span></div>
            <div class="stat-row"><span class="stat-label">Position:</span><span class="stat-value" id="pos-x">0.00</span><span class="stat-value" id="pos-y">0.00</span><span class="stat-value" id="pos-z">0.00</span></div>
            <div class="stat-row"><span class="stat-label">Velocity:</span><span class="stat-value" id="vel-x">0.00</span><span class="stat-value" id="vel-y">0.00</span><span class="stat-value" id="vel-z">0.00</span></div>
            <div class="stat-row"><span class="stat-label">Reflections:</span><span class="stat-value" id="reflections">0</span></div>
            <div class="stat-row"><span class="stat-label">Prime Gaps Crossed:</span><span class="stat-value" id="gaps-crossed">0</span></div>
            <div class="stat-row"><span class="stat-label">Worldline Steps:</span><span class="stat-value" id="steps">0</span></div>
            <div class="stat-row"><span class="stat-label">Mode:</span><span class="stat-value" id="mode">LIVE</span></div>
        </div>
        <div class="hud-panel">
            <div class="hud-title">PRIME ENGINE</div>
            <div class="stat-row"><span class="stat-label">Primes Loaded:</span><span class="stat-value" id="prime-count">0</span></div>
            <div class="stat-row"><span class="stat-label">Gaps Available:</span><span class="stat-value" id="gap-count">0</span></div>
            <div class="stat-row"><span class="stat-label">Current Gap:</span><span class="stat-value" id="current-gap">2</span></div>
            <div class="stat-row"><span class="stat-label">Gap Index:</span><span class="stat-value" id="gap-index">0</span></div>
        </div>
    </div>
    <div id="menu-overlay">
        <div class="menu-title">TGE E1 MENU</div>
        <div class="menu-subtitle">Prime Electron Worldline 3D</div>
        <button class="menu-btn" onclick="TGE.resume()">RESUME</button>
        <button class="menu-btn" onclick="TGE.toggleTheory()">THEORY MODE</button>
        <button class="menu-btn secondary" onclick="TGE.showPrimeExplorer()">PRIME EXPLORER</button>
        <button class="menu-btn secondary" onclick="TGE.showWorldlineHistory()">WORLDLINE HISTORY</button>
        <button class="menu-btn secondary" onclick="TGE.showGapAnalysis()">GAP ANALYSIS</button>
        <button class="menu-btn danger" onclick="TGE.resetSimulation()">RESET SIMULATION</button>
    </div>
    <script src="three.min.js"></script>
    <script>
        const TGE = {
            canvas: null, renderer: null, scene: null, camera: null, width: 0, height: 0,
            electron: { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, radius: 0.5 },
            worldline: [], reflections: 0, steps: 0,
            eggshell: { rx: 0, ry: 0, rz: 0 },
            primeGaps: [], primeGapIndex: 0, gapsCrossed: 0,
            theoryMode: false, running: true, animationId: null,
            insetsTop: 0, insetsBottom: 0,
            menuVisible: false,
            electronMesh: null, worldlineMesh: null, eggshellMesh: null,
            primeGapMeshes: [],
            
            init() {
                this.canvas = document.getElementById('canvas');
                this.setupThreeJS();
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.setupScene();
                this.startLoop();
            },
            
            setupThreeJS() {
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: this.canvas, 
                    antialias: true,
                    alpha: true 
                });
                this.renderer.setPixelRatio(window.devicePixelRatio || 1);
                this.renderer.setClearColor(0x0A0A0F, 1);
                
                this.scene = new THREE.Scene();
                
                this.camera = new THREE.PerspectiveCamera(60, this.width / this.height, 0.1, 1000);
                this.camera.position.set(0, 0, 30);
                this.camera.lookAt(0, 0, 0);
            },
            
            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.renderer.setSize(this.width, this.height);
                this.camera.aspect = this.width / this.height;
                this.camera.updateProjectionMatrix();
                this.setupEggshell();
            },
            
            setupEggshell() {
                const padding = 2;
                this.eggshell.rx = Math.min(this.width, this.height) / 100 - padding;
                this.eggshell.ry = this.eggshell.rx * 0.75;
                this.eggshell.rz = this.eggshell.rx * 0.6;
                
                this.electron.x = 0;
                this.electron.y = 0;
                this.electron.z = 0;
            },
            
            setInsets(top, bottom) {
                this.insetsTop = top;
                this.insetsBottom = bottom;
            },
            
            startLoop() {
                const loop = () => {
                    if (this.running) {
                        this.step();
                        this.render();
                    }
                    this.animationId = requestAnimationFrame(loop);
                };
                loop();
            },
            
            step() {
                this.steps++;
                this.electron.x += this.electron.vx;
                this.electron.y += this.electron.vy;
                this.electron.z += this.electron.vz;
                
                const normX = this.electron.x / this.eggshell.rx;
                const normY = this.electron.y / this.eggshell.ry;
                const normZ = this.electron.z / this.eggshell.rz;
                const distSq = normX * normX + normY * normY + normZ * normZ;
                
                if (distSq >= 1.0) {
                    this.handleReflection(normX, normY, normZ);
                }
                
                this.checkPrimeGaps();
                this.updateHUD();
            },
            
            handleReflection(normX, normY, normZ) {
                this.reflections++;
                const normalLen = Math.sqrt(normX * normX + normY * normY + normZ * normZ);
                const nx = normX / normalLen;
                const ny = normY / normalLen;
                const nz = normZ / normalLen;
                const dot = this.electron.vx * nx + this.electron.vy * ny + this.electron.vz * nz;
                this.electron.vx -= 2 * dot * nx;
                this.electron.vy -= 2 * dot * ny;
                this.electron.vz -= 2 * dot * nz;
                this.electron.vx *= 0.99;
                this.electron.vy *= 0.99;
                this.electron.vz *= 0.99;
                this.electron.x = normX * this.eggshell.rx * 0.98;
                this.electron.y = normY * this.eggshell.ry * 0.98;
                this.electron.z = normZ * this.eggshell.rz * 0.98;
                
                this.worldline.push({ x: this.electron.x, y: this.electron.y, z: this.electron.z, t: this.steps });
                if (this.worldline.length > 2000) this.worldline.shift();
                
                if (window.TGEBridge) {
                    window.TGEBridge.onWorldlineReflection(JSON.stringify({
                        reflections: this.reflections,
                        position: { x: this.electron.x, y: this.electron.y, z: this.electron.z },
                        velocity: { x: this.electron.vx, y: this.electron.vy, z: this.electron.vz }
                    }));
                }
            },
            
            checkPrimeGaps() {
                if (this.primeGaps.length === 0) return;
                const distFromCenter = Math.sqrt(
                    Math.pow(this.electron.x / this.eggshell.rx, 2) +
                    Math.pow(this.electron.y / this.eggshell.ry, 2) +
                    Math.pow(this.electron.z / this.eggshell.rz, 2)
                );
                const gapThreshold = this.primeGaps[this.primeGapIndex] / 100;
                if (distFromCenter > gapThreshold && this.primeGapIndex < this.primeGaps.length - 1) {
                    this.primeGapIndex++;
                    this.gapsCrossed++;
                    if (window.TGEBridge) {
                        window.TGEBridge.onPrimeGapEvent(JSON.stringify({
                            gap: this.primeGaps[this.primeGapIndex],
                            index: this.primeGapIndex,
                            totalCrossed: this.gapsCrossed
                        }));
                    }
                    this.createPrimeGapMesh(this.primeGapIndex);
                }
            },
            
            updateHUD() {
                document.getElementById('pos-x').textContent = this.electron.x.toFixed(2);
                document.getElementById('pos-y').textContent = this.electron.y.toFixed(2);
                document.getElementById('pos-z').textContent = this.electron.z.toFixed(2);
                document.getElementById('vel-x').textContent = this.electron.vx.toFixed(3);
                document.getElementById('vel-y').textContent = this.electron.vy.toFixed(3);
                document.getElementById('vel-z').textContent = this.electron.vz.toFixed(3);
                document.getElementById('reflections').textContent = this.reflections;
                document.getElementById('gaps-crossed').textContent = this.gapsCrossed;
                document.getElementById('steps').textContent = this.steps;
                document.getElementById('mode').textContent = this.theoryMode ? 'THEORY' : 'LIVE';
                document.getElementById('gap-index').textContent = this.primeGapIndex;
                document.getElementById('current-gap').textContent = this.primeGaps[this.primeGapIndex] || 0;
            },
            
            setupScene() {
                this.createEggshell();
                this.createElectron();
                this.createWorldline();
                this.createPrimeGapMeshes();
                this.setupLights();
            },
            
            createEggshell() {
                const geometry = new THREE.SphereGeometry(1, 64, 32);
                geometry.scale(this.eggshell.rx, this.eggshell.ry, this.eggshell.rz);
                
                const material = new THREE.MeshBasicMaterial({
                    color: 0x4488FF,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.DoubleSide
                });
                
                this.eggshellMesh = new THREE.Mesh(geometry, material);
                this.scene.add(this.eggshellMesh);
            },
            
            createElectron() {
                const geometry = new THREE.SphereGeometry(this.electron.radius, 32, 32);
                
                const material = new THREE.MeshBasicMaterial({
                    color: 0x00FFFF,
                    transparent: true,
                    opacity: 1
                });
                
                this.electronMesh = new THREE.Mesh(geometry, material);
                this.electronMesh.position.set(0, 0, 0);
                
                const glowGeometry = new THREE.SphereGeometry(this.electron.radius * 3, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00FFFF,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide
                });
                const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                this.electronMesh.add(glowMesh);
                
                this.scene.add(this.electronMesh);
            },
            
            createWorldline() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(2000 * 3);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setDrawRange(0, 0);
                
                const material = new THREE.LineBasicMaterial({
                    color: 0x00D4AA,
                    transparent: true,
                    opacity: 0.8
                });
                
                this.worldlineMesh = new THREE.Line(geometry, material);
                this.scene.add(this.worldlineMesh);
            },
            
            createPrimeGapMeshes() {
                for (let i = 0; i < 50; i++) {
                    const radius = (2 / 100) * Math.min(this.eggshell.rx, this.eggshell.ry, this.eggshell.rz);
                    const geometry = new THREE.RingGeometry(radius * 0.98, radius, 64);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0xF97316,
                        transparent: true,
                        opacity: 0.1,
                        side: THREE.DoubleSide
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.visible = false;
                    this.primeGapMeshes.push(mesh);
                    this.scene.add(mesh);
                }
            },
            
            createPrimeGapMesh(index) {
                if (index >= this.primeGapMeshes.length) return;
                const gap = this.primeGaps[index] || 2;
                const radius = (gap / 100) * Math.min(this.eggshell.rx, this.eggshell.ry, this.eggshell.rz);
                
                const mesh = this.primeGapMeshes[index];
                mesh.scale.set(radius / 2, radius / 2, radius / 2);
                mesh.material.color.setHex(0xF97316);
                mesh.material.opacity = 0.4;
                mesh.visible = true;
            },
            
            setupLights() {
                const ambient = new THREE.AmbientLight(0x404060, 0.5);
                this.scene.add(ambient);
                
                const pointLight = new THREE.PointLight(0x00D4AA, 1, 100);
                pointLight.position.set(0, 0, 20);
                this.scene.add(pointLight);
            },
            
            render() {
                this.updateMeshes();
                
                this.eggshellMesh.rotation.y += 0.0002;
                this.eggshellMesh.rotation.x += 0.0001;
                
                this.renderer.render(this.scene, this.camera);
            },
            
            updateMeshes() {
                if (this.electronMesh) {
                    this.electronMesh.position.set(this.electron.x, this.electron.y, this.electron.z);
                }
                
                if (this.worldlineMesh && this.worldline.length > 1) {
                    const positions = this.worldlineMesh.geometry.attributes.position.array;
                    let drawCount = 0;
                    for (let i = 0; i < this.worldline.length; i++) {
                        const pt = this.worldline[i];
                        positions[i * 3] = pt.x;
                        positions[i * 3 + 1] = pt.y;
                        positions[i * 3 + 2] = pt.z;
                        drawCount++;
                    }
                    this.worldlineMesh.geometry.setDrawRange(0, drawCount);
                    this.worldlineMesh.geometry.attributes.position.needsUpdate = true;
                }
                
                if (this.primeGapMeshes[this.primeGapIndex]) {
                    const mesh = this.primeGapMeshes[this.primeGapIndex];
                    if (mesh.visible) {
                        mesh.rotation.z += 0.002;
                    }
                }
            },
            
            onScanPressed() {
                this.electron.vx += (Math.random() - 0.5) * 5;
                this.electron.vy += (Math.random() - 0.5) * 5;
                this.electron.vz += (Math.random() - 0.5) * 5;
            },
            
            toggleMenu() {
                this.menuVisible = !this.menuVisible;
                document.getElementById('menu-overlay').classList.toggle('visible', this.menuVisible);
            },
            
            resume() { this.toggleMenu(); },
            
            toggleTheory() {
                this.theoryMode = !this.theoryMode;
                document.getElementById('mode').textContent = this.theoryMode ? 'THEORY' : 'LIVE';
            },
            
            setTheoryMode(enabled) {
                this.theoryMode = enabled;
            },
            
            showPrimeExplorer() { alert('Prime Explorer - Coming Soon'); },
            showWorldlineHistory() { alert('Worldline History - Coming Soon'); },
            showGapAnalysis() { alert('Gap Analysis - Coming Soon'); },
            resetSimulation() {
                this.electron.x = 0; this.electron.y = 0; this.electron.z = 0;
                this.electron.vx = 0; this.electron.vy = 0; this.electron.vz = 0;
                this.worldline = [];
                this.reflections = 0;
                this.steps = 0;
                this.gapsCrossed = 0;
                this.primeGapIndex = 0;
                this.primeGapMeshes.forEach(m => m.visible = false);
            },
            
            onReady(data) { console.log('TGE ready:', data); },
            toggleFleet() { console.log('Fleet toggle'); }
        };
        
        const PrimeEngine = {
            init(tilesData) {
                const allBytes = [];
                for (const tile of tilesData) {
                    for (const b of tile) {
                        allBytes.push(b & 0xFF);
                    }
                }
                
                const primes = [];
                for (let i = 0; i + 3 < allBytes.length; i += 4) {
                    const prime = (allBytes[i] << 24) | (allBytes[i+1] << 16) | (allBytes[i+2] << 8) | allBytes[i+3];
                    if (prime > 1) primes.push(prime);
                }
                
                const gaps = [];
                let lastPrime = 2;
                for (const p of primes) {
                    if (p > lastPrime) {
                        gaps.push(p - lastPrime);
                        lastPrime = p;
                    }
                }
                
                TGE.primeGaps = gaps.map(g => Math.max(2, Math.min(50, g * 2))).slice(0, 50);
                
                document.getElementById('prime-count').textContent = primes.length;
                document.getElementById('gap-count').textContent = TGE.primeGaps.length;
                document.getElementById('current-gap').textContent = TGE.primeGaps[0] || 0;
                
                console.log('PrimeEngine init:', primes.length, 'primes,', TGE.primeGaps.length, 'gaps');
            }
        };
        
        window.TGE = TGE;
        window.PrimeEngine = PrimeEngine;
        
        document.addEventListener('DOMContentLoaded', () => {
            TGE.init();
        });
    </script>
</body>
</html>
