        }
        for (let z=-size;z<=size;z+=step) {
            const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-size,-0.1,z),new THREE.Vector3(size,-0.1,z)]);
            this.scene.add(new THREE.Line(g,mat));
        }
    },

    _populateLegend() {
        const legend = document.getElementById('particle-legend');
        legend.innerHTML = Object.entries(PARTICLES).map(([name, p]) =>
            `<div><span class="swatch" style="background:#${p.color.toString(16).padStart(6,'0')}"></span>${name.replace(/_/g,' ')}</div>`
        ).join('');
    },_animate() {
        requestAnimationFrame(() => this._animate());
        const dt = this.clock.getDelta();
        this.currentTime += dt * 1000;
        if (this.currentTime >= this.maxTime) {
            this.currentTime = 0;
            this.foldWorldlines();
        }
        const prog = (this.currentTime / this.maxTime) * 100;
        document.getElementById('progress-bar').style.width = prog + '%';
        document.getElementById('loop-timer').textContent = (this.currentTime / 1000).toFixed(2) + 's';
        
        // GPU particle simulation step
        this.gpuParticles.setSpeed(this.speed);
        this.gpuParticles.setPrimeMode(primeModeActive);
        this.gpuParticles.setReinmanMode(reinmanModeActive);
        this.gpuParticles.setMetaDepth(metaDepth);
        this.gpuParticles.setSwarmMode(swarmModeActive);
        this.gpuParticles.step(dt);
        
        this._updateFields(dt);
        
        if (!Flight.active) {
            this.orbitControls.update();
        }
        this.composer.render();
    },
    
    _updateFields(dt) {
        if (this.axionField) {
            this.axionField.rotation.y += 0.0008;
            this.axionField.rotation.x = Math.sin(Date.now() * 0.0001) * 0.1;
        }
        if (this.primeField && primeModeActive) {
            this.primeField.rotation.y += 0.001;
        }
        if (this.reinmanField && reinmanModeActive) {
            this.reinmanField.rotation.y += 0.0003;
            this.reinmanField.rotation.z += 0.0002;
        }
        
        // Update displays
        if (primeModeActive) {
            const gapDisp = document.getElementById('prime-gap-display');
            gapDisp.innerHTML = `Gaps: ${PRIME_GAPS.slice(0,8).join(', ')}...<br>π(x) ~ x/log x<br>π₂(x) ~ 2C₂x/log²x<br>Reinman: ${REINMAN_NUMBER.toFixed(6)}`;
        }
        
        const metaDisp = document.getElementById('meta-depth-display');
        metaDisp.innerHTML = `D = ω+${metaDepth}<br>Iteration: π⁽${metaDepth}⁾(n)`;
        
        const reinmanDisp = document.getElementById('reinman-display');
        reinmanDisp.innerHTML = reinmanModeActive ? `One Electron Universe ACTIVE<br>Accuracy: ${REINMAN_ACCURACY}%<br>3.67B gaps processed` : `One Electron Universe INACTIVE`;
        
        // Update chart
        if (Math.random() < 0.04) {
            // Approximate metrics from GPU particles
            pushChart(Math.random() * 10, Math.random() * 15, Math.random() * 20, Math.random() * 5);
        }
    },

    foldWorldlines() {
        this.maxTime += CFG.loopInc; this.cycle++;
        const bloom = this.composer.passes[1]; const orig = bloom.strength;
        bloom.strength = 5.0; setTimeout(() => { bloom.strength = orig; }, 600);
        if (this.trailDecay) {
            const hg = this.gpuParticles.getMesh().geometry.clone();
            const hm = new THREE.PointsMaterial({color: 0x1e293b, size: 0.08, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending});
            const hp = new THREE.Points(hg, hm); this.scene.add(hp);
            setTimeout(() => { this.scene.remove(hp); hg.dispose(); hm.dispose(); }, this.maxTime * 2);
        }
        document.getElementById('cycle-count').textContent = this.cycle;
        document.getElementById('max-dur').textContent = (this.maxTime / 1000).toFixed(1) + 's';
        logEvent('[FOLD] Iteration ' + this.cycle + ': worldline complexity increased');
        showEquation('Fold ' + this.cycle + ': τ → τ + Δτ [proper time evolution]');
        if (reinmanModeActive) showEquation('Reinman: 1 electron = all electrons [worldline identity]');
    },

    perturb() { 
        this.gpuParticles.setSpeed(this.speed * 3);
        const bloom = this.composer.passes[1]; bloom.strength = 3.0; setTimeout(() => bloom.strength = CFG.bloomStrength, 400);
        logEvent('[PERTURB] Field entropy spike'); showEquation('ΔS > 0 [second law]'); flashButton('Perturb');
        setTimeout(() => this.gpuParticles.setSpeed(this.speed), 500);
    },
    toggleTrails() { this.trailDecay = !this.trailDecay; logEvent('[TRAILS] ' + (this.trailDecay ? 'ON' : 'OFF')); flashButton('Trails'); },
    spawnDemon() { 
        const bloom = this.composer.passes[1]; bloom.strength = 4.5; setTimeout(() => bloom.strength = CFG.bloomStrength, 800);
        logEvent('[DEMON] Pines Demon spawned'); showEquation('ω_D = √(n_e e²/ε₀m*) [Demon frequency]'); flashButton('Demon');
    },
    triggerFusion() { 
        const bloom = this.composer.passes[1]; bloom.strength = 6.0; setTimeout(() => bloom.strength = CFG.bloomStrength, 1000);
        logEvent('[FUSION] NIF-style ignition! Q > 1'); showEquation('D + T → ⁴He + n + 17.6 MeV [fusion]'); flashButton('Fusion');
    },
    spawnGlueball() { 
        const bloom = this.composer.passes[1]; bloom.strength = 3.5; setTimeout(() => bloom.strength = CFG.bloomStrength, 600);
        logEvent('[GLUEBALL] Glueball worldline formed: m = 1.7 GeV, J^PC = 0^++'); this.glueballActive = true; showEquation('G: ⟨0|F^a_{μν}F^{aμν}|G⟩ [glueball operator]'); flashButton('Glueball');
    },
    toggleSwarm() { swarmModeActive = !swarmModeActive; logEvent('[SWARM] ' + (swarmModeActive ? 'ON' : 'OFF')); showEquation('v_i = v_i + αΣ(v_j - v_i) + β∇U [swarm]'); flashButton('Swarm'); },
    togglePrimeMode() { primeModeActive = !primeModeActive; logEvent('[PRIME] Gap holography ' + (primeModeActive ? 'ON' : 'OFF')); if (this.primeField) { this.primeField.visible = primeModeActive; } showEquation('π(x) = li(x) - Σ_ρ li(x^ρ) [explicit formula]'); flashButton('Prime'); },
    toggleReinmanMode() { reinmanModeActive = !reinmanModeActive; logEvent('[REINMAN] One-Electron Universe ' + (reinmanModeActive ? 'ACTIVATED' : 'DEACTIVATED')); if (this.reinmanField) { this.reinmanField.visible = reinmanModeActive; } document.getElementById('reinman-indicator').classList.toggle('hidden', !reinmanModeActive); showEquation('Reinman: ψ(x) = Σ_n a_n ψ_n(x) [one electron = all electrons]'); showEquation('m_e = (Σ twin prime gaps) / π [electron mass from prime structure]'); flashButton('Reinman'); },
    cycleMetaDepth() { metaDepth = (metaDepth % 5) + 1; document.getElementById('meta-depth-value').textContent = 'ω+' + metaDepth; logEvent('[META] Depth: ω+' + metaDepth); showEquation('π⁽' + metaDepth + '⁾(n) = π(π(...π(n)...)) [Meta-Depth]'); flashButton('Meta'); },
    triggerQCD() { const b = this.composer.passes[1]; b.strength = 4.0; setTimeout(() => b.strength = CFG.bloomStrength, 700); logEvent('[QCD] Strong force interaction'); showEquation('L_QCD = Σ_f ψ̄_f(iγ^μD_μ - m_f)ψ_f - ¼G^a_{μν}G^{aμν}'); flashButton('QCD'); },
    triggerEW() { const b = this.composer.passes[1]; b.strength = 3.5; setTimeout(() => b.strength = CFG.bloomStrength, 600); logEvent('[EW] Electroweak symmetry breaking'); showEquation('L_EW = L_gauge + L_Higgs + L_Yukawa + L_fermion'); flashButton('EWeak'); },
    triggerGravity() { const b = this.composer.passes[1]; b.strength = 5.0; setTimeout(() => b.strength = CFG.bloomStrength, 900); logEvent('[GRAVITY] Curvature interaction'); showEquation('G_μν + Λg_μν = (8πG/c⁴)T_μν [Einstein]'); flashButton('Gravity'); },
    setSpeed(v) { this.speed = parseFloat(v); document.getElementById('speed-val').textContent = parseFloat(v).toFixed(1) + '×'; this.gpuParticles.setSpeed(this.speed); },
    setDensity(v) { document.getElementById('dens-val').textContent = v; logEvent('[CONFIG] Density: ' + v); this.gpuParticles.setParticleCount(parseInt(v)); },
};const Flight = {
    active: false, paused: false, lock: false, waypoints: [], progress: 0, startTime: 0, animFrame: null,
    camera: null, controls: null,
    init(camera, controls) { this.camera = camera; this.controls = controls; },
    generateWaypoints() { const pts = []; for (let i = 0; i < 12; i++) pts.push(new THREE.Vector3((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 60)); pts.push(pts[0].clone()); return pts; },
    toggle() { if (this.active) this.stop(); else this.start(); },
    start() {
        this.waypoints = this.generateWaypoints(); this.progress = 0; this.paused = false; this.active = true; this.startTime = performance.now();
        document.getElementById('btn-flight').innerHTML = '✈ Flying <label style="margin-left:8px;cursor:pointer;"><input type="checkbox" id="flight-lock" onchange="Flight.lock=this.checked" title="Infinite flight mode"' + (this.lock ? ' checked' : '') + '> Lock</label>';
        this.controls.enabled = false; logEvent('[FLIGHT] Started' + (this.lock ? ' [LOCKED]' : '')); this._tick();
    },
    stop() {
        if (this.lock) { this.waypoints = this.generateWaypoints(); this.progress = 0; this.startTime = performance.now(); logEvent('[FLIGHT] Lock: new path, continuing…'); this._tick(); return; }
        this.active = false; if (this.animFrame) cancelAnimationFrame(this.animFrame); this.controls.enabled = true;
        document.getElementById('btn-flight').innerHTML = '✈ Flight <label style="margin-left:8px;cursor:pointer;"><input type="checkbox" id="flight-lock" onchange="Flight.lock=this.checked" title="Infinite flight mode"> Lock</label>';
        document.getElementById('flight-progress').style.width = '0%'; logEvent('[FLIGHT] Stopped');
    },
    _tick() {
        if (!this.active || this.paused) return;
        const now = performance.now(); this.progress = Math.min((now - this.startTime) / 18000, 1);
        const t = this.progress * (this.waypoints.length - 1); const i = Math.floor(t); const f = t - i;
        const p0 = this.waypoints[Math.max(0, i - 1)]; const p1 = this.waypoints[i];
        const p2 = this.waypoints[Math.min(this.waypoints.length - 1, i + 1)]; const p3 = this.waypoints[Math.min(this.waypoints.length - 1, i + 2)];
        const pos = this._catmullRom(p0, p1, p2, p3, f);
        const lookAhead = this._catmullRom(p0, p1, p2, p3, Math.min(f + 0.05, 1));
        this.camera.position.lerp(pos, 0.06);
        const target = new THREE.Vector3().lerpVectors(this.controls.target, lookAhead, 0.04); this.controls.target.copy(target);
        document.getElementById('flight-progress').style.width = (this.progress * 100) + '%';
        if (this.progress >= 1) { this.stop(); return; }
        this.animFrame = requestAnimationFrame(() => this._tick());
    },
    _catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t, t3 = t2 * t;
        return new THREE.Vector3(
            0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
            0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
            0.5 * ((2 * p1.z) + (-p0.z + p2.z) * t + (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t2 + (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t3)
        );
    }
};

window.addEventListener('DOMContentLoaded', () => { sim.init(); document.getElementById('live-badge').style.display = 'block'; logEvent('[BOOT] ULTIMATEv2 TGPU v3.0 JJ1 — GPU Prime Electron Holographic Universe'); });
