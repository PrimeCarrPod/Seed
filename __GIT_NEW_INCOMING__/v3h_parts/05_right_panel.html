<!-- Right Panel - TUCKABLE -->
  <div id="hud-right" class="absolute top-70 right-4 z-20 w-64 flex flex-col gap-2 pointer-events-none">
    <div class="hud hud-compact p-2 pointer-events-auto">
      <h3 class="text-green-400 text-xs orbitron uppercase tracking-wider border-b border-green-900/50 pb-1 mb-1">Simulation Controls</h3>
      <div class="grid grid-cols-2 gap-1 text-xs mb-2">
        <button onclick="sim.perturb()" class="btn btn-red">Perturb</button>
        <button onclick="sim.toggleTrails()" class="btn btn-purple">Trails</button>
        <button onclick="sim.spawnDemon()" class="btn btn-yellow">Pines Demon!</button>
        <button onclick="sim.triggerFusion()" class="btn btn-green">Fusion Event</button>
        <button onclick="sim.spawnGlueball()" class="btn btn-orange">Glueball!</button>
        <button onclick="sim.toggleSwarmMode()" class="btn btn-purple">Swarm</button>
      </div>
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-gray-400"><span>Larmor Freq</span><span id="speed-val" class="text-cyan-300">1.0×</span></div>
        <input type="range" min="0.1" max="4" step="0.1" value="1.0" class="w-full h-1 bg-gray-700 rounded cursor-pointer" oninput="sim.setSpeed(this.value)">
        <div class="flex justify-between text-xs text-gray-400"><span>Density</span><span id="dens-val" class="text-cyan-300">1700</span></div>
        <input type="range" min="200" max="150000" step="100" value="1700" class="w-full h-1 bg-gray-700 rounded cursor-pointer" oninput="sim.setDensity(this.value)">
      </div>
    </div>

    <div id="hud-flight" class="hud hud-compact p-2 pointer-events-auto" style="display:none">
      <h3 class="text-purple-400 text-xs orbitron uppercase tracking-wider border-b border-purple-900/50 pb-1 mb-1">Random Flight Path</h3>
      <div class="flex justify-between text-xs text-gray-400 mb-1">
        <span>Waypoint</span><span id="flight-wp" class="text-purple-300 font-bold">0 / 0</span>
      </div>
      <div class="w-full bg-gray-900 h-1 rounded-full overflow-hidden mb-1">
        <div id="flight-bar" class="h-full" style="background:linear-gradient(to right,#a855f7,#ec4899);width:0%"></div>
      </div>
      <div class="flex gap-1">
        <button id="btn-pause-flight" onclick="Flight.togglePause()" class="btn btn-purple flex-1">⏸ Pause</button>
        <button onclick="Flight.stop()" class="btn btn-red flex-1">✕ Stop</button>
      </div>
    </div>

    <div class="hud hud-compact p-2 pointer-events-auto">
      <h3 class="text-yellow-400 text-xs orbitron uppercase tracking-wider border-b border-yellow-900/50 pb-1 mb-1">Benevolence Monitor</h3>
      <div style="position:relative;width:100%;height:100px"><canvas id="metricsChart"></canvas></div>
      <div class="mt-1 text-xs text-gray-500 text-center">Action (S) · Benevolence (B = C·F·S) · Coherence (C) · Glueball (G) · Prime (P)</div>
    </div>
  </div>
