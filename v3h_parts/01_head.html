  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

    :root {
      --electron:   #38bdf8;
      --proton:     #f43f5e;
      --neutron:    #94a3b8;
      --photon:     #fef08a;
      --axion:      #10b981;
      --neutralino: #a855f7;
      --gluon:      #f97316;
      --higgs:      #ec4899;
      --neutrino:   #67e8f9;
      --quark-u:    #fbbf24;
      --quark-d:    #60a5fa;
      --muon:       #e879f9;
      --pion:       #86efac;
      --kaon:       #fcd34d;
      --demon:      #4c1d95;
      --graviton:   #d1fae5;
      --wboson:     #fb7185;
      --zboson:     #a78bfa;
      --glueball:   #f97316;
      --swarm:      #a855f7;
      --prime:      #facc15;
      --riemann:    #f472b6;

    * { box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: #020208; color: #e2e8f0; overflow: hidden; margin: 0; }
    h1, h2, h3, .orbitron { font-family: 'Orbitron', sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .hud { background: rgba(5, 8, 20, 0.82); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 8px; z-index: 10; transition: opacity 0.4s ease, transform 0.4s ease; }
    .hud.hidden-hud { opacity: 0; pointer-events: none; transform: translateY(20px); }
    .swatch { display: inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
    .btn { padding: 6px 12px; border-radius:5px; cursor:pointer; font-size:11px; font-family:'Orbitron',sans-serif; text-transform:uppercase; letter-spacing:0.05em; transition: all 0.2s; border: 1px solid; }
    .btn-cyan { background:rgba(56,189,248,0.15); border-color:rgba(56,189,248,0.5); color:#38bdf8; }
    .btn-cyan:hover { background:rgba(56,189,248,0.35); }
    .btn-green { background:rgba(16,185,129,0.15); border-color:rgba(16,185,129,0.5); color:#10b981; }
    .btn-green:hover { background:rgba(16,185,129,0.35); }
    .btn-purple{ background:rgba(168,85,247,0.15); border-color:rgba(168,85,247,0.5); color:#a855f7; }
    .btn-purple:hover{ background:rgba(168,85,247,0.35); }
    .btn-red   { background:rgba(244,63,94,0.15); border-color:rgba(244,63,94,0.5); color:#f43f5e; }
    .btn-red:hover   { background:rgba(244,63,94,0.35); }
    .btn-yellow{ background:rgba(254,240,138,0.15); border-color:rgba(254,240,138,0.5); color:#fef08a; }
    .btn-yellow:hover{ background:rgba(254,240,138,0.35); }
    .btn-orange{ background:rgba(249,115,22,0.15); border-color:rgba(249,115,22,0.5); color:#f97316; }
    .btn-orange:hover{ background:rgba(249,115,22,0.35); }
    .btn-prime { background:rgba(250,204,21,0.15); border-color:rgba(250,204,21,0.5); color:#facc15; }
    .btn-prime:hover{ background:rgba(250,204,21,0.35); }
    .btn-riemann { background:rgba(244,114,182,0.15); border-color:rgba(244,114,182,0.5); color:#f472b6; }
    .btn-riemann:hover{ background:rgba(244,114,182,0.35); }
    #flight-progress { position:absolute; bottom:0; left:0; height:3px; background: linear-gradient(90deg,#38bdf8,#a855f7,#f43f5e); transition: width 0.2s linear; z-index: 30; }
    .scrollable::-webkit-scrollbar { width:4px; }
    .scrollable::-webkit-scrollbar-track { background:rgba(0,0,0,0.3); }
    .scrollable::-webkit-scrollbar-thumb { background:rgba(56,189,248,0.5); border-radius:2px; }

    /* Opening Screen Styles - COMPACT VERSION */
    #opening-screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(2,2,8,0.98); backdrop-filter: blur(8px); }
    #opening-screen.hidden { display: none; }
    .opening-card { background: rgba(10,15,30,0.95); border: 1px solid rgba(56,189,248,0.3); border-radius: 12px; padding: 24px; max-width: 560px; width: 90%; color: #e2e8f0; box-shadow: 0 0 40px rgba(56,189,248,0.15); }
    .opening-title { font-family: 'Orbitron',sans-serif; font-size: 1.6rem; font-weight: 900; color: #facc15; text-align: center; letter-spacing: 0.1em; margin-bottom: 4px; }
    .opening-subtitle { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-bottom: 16px; }
    .opening-section { margin-bottom: 14px; }
    .opening-section-title { font-family: 'Orbitron',sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #38bdf8; margin-bottom: 8px; }
    .res-group { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .res-option { padding: 8px 12px; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); border-radius: 6px; cursor: pointer; transition: all 0.2s; min-width: 90px; text-align: center; }
    .res-option:hover { background: rgba(56,189,248,0.2); }
    .res-option.selected { background: rgba(56,189,248,0.4); border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,0.3); }
    .res-label { font-family: 'Orbitron',sans-serif; font-size: 0.65rem; font-weight: 700; color: #38bdf8; }
    .res-desc { font-size: 0.55rem; color: #64748b; margin-top: 2px; }
    .param-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .param-label { font-size: 0.65rem; color: #94a3b8; min-width: 130px; }
    .param-slider { flex: 1; min-width: 140px; accent-color: #38bdf8; }
    .param-value { font-family: 'Orbitron',sans-serif; font-size: 0.65rem; color: #facc15; min-width: 50px; text-align: right; }
    .param-rand-btn { background: rgba(244,114,182,0.15); border: 1px solid rgba(244,114,182,0.5); color: #f472b6; border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .param-rand-btn:hover { background: rgba(244,114,182,0.35); }
    .param-rand-btn.active { background: rgba(244,114,182,0.4); box-shadow: 0 0 8px rgba(244,114,182,0.3); }
    .opening-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .btn-v2 { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Orbitron',sans-serif; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; border: 1px solid; }
    .btn-v2-primary { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.6); color: #10b981; }
    .btn-v2-primary:hover { background: rgba(16,185,129,0.4); box-shadow: 0 0 16px rgba(16,185,129,0.4); }
    .btn-v2-secondary { background: rgba(148,163,184,0.15); border-color: rgba(148,163,184,0.5); color: #94a3b8; }
    .btn-v2-secondary:hover { background: rgba(148,163,184,0.3); }
    .btn-v2-load { background: rgba(250,204,21,0.2); border-color: rgba(250,204,21,0.6); color: #facc15; }
    .btn-v2-load:hover { background: rgba(250,204,21,0.4); box-shadow: 0 0 16px rgba(250,204,21,0.4); }

    /* TUCKABLE MENU SYSTEM (from bounce.html) */
    .pg { position: fixed; z-index: 20; display: flex; flex-direction: column; gap: 4px; }
    .tab { writing-mode: vertical-rl; text-orientation: mixed; padding: 8px 4px; cursor: pointer; background: rgba(5,8,20,0.9); border: 1px solid rgba(56,189,248,0.3); border-radius: 6px 6px 0 0; font-family: 'Orbitron',sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; user-select: none; transition: all 0.2s; }
    .tab:hover { background: rgba(56,189,248,0.2); }
    .tab.tab-l { border-radius: 6px 0 0 6px; border-right: none; }
    .tab.tab-r { border-radius: 0 6px 6px 0; border-left: none; }

    /* Left panels - tuckable */
    #hud-left { position: fixed; top: 70px; left: 4px; z-index: 20; display: flex; flex-direction: column; gap: 4px; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
    #hud-left.tucked { transform: translateX(calc(-100% + 28px)); }
    #hud-left .hud { pointer-events: auto; }

    /* Right panels - tuckable */
    #hud-right { position: fixed; top: 70px; right: 4px; z-index: 20; display: flex; flex-direction: column; gap: 4px; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
    #hud-right.tucked { transform: translateX(calc(100% - 28px)); }
    #hud-right .hud { pointer-events: auto; }

    /* TUCK BUTTON */
    #btn-tuck { position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(5,8,20,0.9); border: 1px solid rgba(250,204,21,0.4); border-radius: 6px; padding: 6px 12px; color: #facc15; font-family: 'Orbitron',sans-serif; font-size: 9px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    #btn-tuck:hover { background: rgba(250,204,21,0.15); box-shadow: 0 0 12px rgba(250,204,21,0.3); }

    /* COMPACT HUD PANELS */
    .hud-compact { padding: 8px; }
    .hud-compact h3 { font-size: 0.6rem; margin-bottom: 6px; padding-bottom: 4px; }
    .hud-compact .grid { gap: 0.3rem; }
    .hud-compact button { padding: 4px 8px; font-size: 0.6rem; }
    .hud-compact .space-y-2 > * { margin-bottom: 4px; }
    .hud-compact .flex.justify-between { margin-bottom: 2px; }
    .hud-compact input[type="range"] { margin-top: 2px; margin-bottom: 2px; }

    /* View Panels */
    .view-panel { position: fixed; top: 70px; background: rgba(5,8,20,0.92); border: 1px solid rgba(56,189,248,0.25); border-radius: 8px; padding: 12px; max-height: 70vh; overflow-y: auto; z-index: 20; display: none; }
    .view-panel.visible { display: block; }
    .view-panel.left { left: 4px; }
    .view-panel.right { right: 4px; }
    .view-panel.center { left: 50%; transform: translateX(-50%); }
    .view-title { font-family: 'Orbitron',sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .view-close { background: none; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; }
    .prime-gap-bar { height: 3px; background: linear-gradient(90deg, #facc15, #f472b6); border-radius: 1px; margin: 1px 0; opacity: 0.8; }
    .riemann-zero { height: 2px; background: #f472b6; border-radius: 1px; margin: 0.5px 0; opacity: 0.7; }
    .hilbert-cell { height: 4px; border-radius: 1px; margin: 1px 0; }

    /* Camera Follow HUD Panel */
    #hud-follow { position: fixed; top: 70px; left: 4px; background: rgba(5,8,20,0.92); border: 1px solid rgba(16,185,129,0.3); border-radius: 8px; padding: 10px; z-index: 20; display: none; min-width: 180px; }
    #hud-follow.visible { display: block; }
    .follow-title { font-family: 'Orbitron',sans-serif; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: #10b981; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .follow-row { display: flex; justify-content: space-between; font-size: 0.65rem; margin: 3px 0; }
    .follow-label { color: #94a3b8; }
    .follow-value { color: #10b981; font-family: 'Orbitron',sans-serif; font-weight: 700; }
    .follow-bar { width: 100%; height: 3px; background: #0f172a; border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .follow-bar-fill { height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); width: 0%; transition: width 0.1s; }

    /* Trail History Panel */
    #hud-trails { position: fixed; bottom: 70px; left: 4px; background: rgba(5,8,20,0.92); border: 1px solid rgba(168,85,247,0.3); border-radius: 8px; padding: 10px; z-index: 20; display: none; min-width: 180px; max-height: 180px; }
    #hud-trails.visible { display: block; }
    .trails-title { font-family: 'Orbitron',sans-serif; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: #a855f7; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .trail-entry { font-size: 0.6rem; color: #94a3b8; margin: 1px 0; font-family: monospace; }
    .trail-entry.active { color: #a855f7; }

    /* Worldline Fold Indicator */
    #fold-indicator { position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); background: rgba(5,8,20,0.9); border: 1px solid rgba(250,204,21,0.4); border-radius: 6px; padding: 6px 12px; z-index: 30; display: none; pointer-events: none; }
    #fold-indicator.visible { display: block; animation: foldPulse 0.5s ease-out; }
    @keyframes foldPulse { 0% { opacity: 0; transform: translateX(-50%) scale(0.9); } 50% { opacity: 1; transform: translateX(-50%) scale(1.05); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
    .fold-text { font-family: 'Orbitron',sans-serif; font-size: 0.65rem; color: #facc15; text-align: center; }
  </style>
