function genSSID(v,dynamic){
  var h=String(dynamic?dynamic.heading:v.heading||90).padStart(3,'0');
  var s=String(Math.floor(dynamic?dynamic.speed:v.speed||65)).padStart(3,'0');
  return 'TAF'+h+'/'+(v.fleet||'CIV')+s+'-'+v.make.substring(0,3).toUpperCase()+v.color.substring(0,3).toUpperCase();
}
function genDMVCode(v){return (v.state||'FL')+'-'+String((v.year||2025)).substring(2)+'-'+String(Math.floor(Math.random()*99999)).padStart(5,'0')}

const Bounce={scene:null,camera:null,renderer:null,composer:null,controls:null,clock:new THREE.Clock(),beacons:[],staticNodes:[],realNodes:[],tardi:{},dots:[],spin:true,fleetMode:false,broadcast:false,povMode:false,_povOffset:0,myHeading:90,mySpeed:0,myAlt:450,scanMeta:{},useRealData:false,_flyVx:0,_flyVy:0,_flyVz:0,_flySpeed:1,_broadcastSlot:0,licensePlate:'CarrPodNet',originKey:'',_lastTiming:0,btNodes:[],bt3dNodes:[],bt3dSpatial:{},theoryMode:false,theoryTrajectoryGroup:null,trailActive:false,trailPoints:[],trailLine:null,
  init(){
    var c=document.getElementById('canvas-container');
    this.scene=new THREE.Scene();this.scene.fog=new THREE.FogExp2(0x010206,.008);
    this.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
    this.camera.position.set(0,18,30);
    this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    this.renderer.setSize(innerWidth,innerHeight);this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    c.appendChild(this.renderer.domElement);
    this.controls=new THREE.OrbitControls(this.camera,this.renderer.domElement);
    this.controls.enableDamping=true;this.controls.dampingFactor=.07;this.controls.autoRotate=true;this.controls.autoRotateSpeed=.3;
    var rp=new THREE.RenderPass(this.scene,this.camera);
    var bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,.4,.8);
    this.composer=new THREE.EffectComposer(this.renderer);this.composer.addPass(rp);this.composer.addPass(bloom);
    this.scene.add(new THREE.AmbientLight(0x151525));
    var pl=new THREE.PointLight(0xffffff,2,150);pl.position.set(0,25,0);this.scene.add(pl);
    this._buildGrid();this._buildTardigrade();this._genBeacons(8);this._genStaticNodes(12);
    window.addEventListener('resize',()=>{this.camera.aspect=innerWidth/innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(innerWidth,innerHeight);this.composer.setSize(innerWidth,innerHeight)});
    document.getElementById('fleet-ind').textContent='OFF';
    this._startScanner();this._animate();setTimeout(()=>{androidBridge('onReady',{loaded:true})},1000);
  },
  _buildGrid(){
    var m=new THREE.LineBasicMaterial({color:0x0a1230,transparent:true,opacity:.3});
    for(var x=-40;x<=40;x+=5){this.scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-.1,-40),new THREE.Vector3(x,-.1,40)]),m))}
