<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertebrae Sessions</title>
    <link rel="stylesheet" href="../assets/css/sidebar.css">
</head>
<body>
    <div id="app">
        <header class="toolbar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v18M3 12h18M6 6l12 12M18 6l-12 12"/>
                </svg>
                <span>Vertebrae</span>
            </div>
            <div class="toolbar-actions">
                <button id="btn-new-group" class="icon-btn" title="New Group" aria-label="New Group">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
                <button id="btn-import" class="icon-btn" title="Import Sessions" aria-label="Import Sessions">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 10l5 5-5 5M7 10l-5 5 5 5"/>
                    </svg>
                </button>
                <button id="btn-export" class="icon-btn" title="Export Sessions" aria-label="Export Sessions">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 10l5 5-5 5M7 10l-5 5 5 5"/>
                    </svg>
                </button>
                <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="section">
                <div class="section-header">
                    <h2>Session Groups</h2>
                    <span id="group-count" class="count">0</span>
                </div>
                <div id="groups-container" class="groups-container" role="list" aria-label="Session Groups">
                    <!-- Groups rendered here -->
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <div>
                        <h2>Sessions</h2>
                        <span id="session-count" class="count">0 sessions</span>
                    </div>
                    <button id="btn-new-session" class="btn-primary" aria-label="Add Session">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>Add Session</span>
                    </button>
                </div>
            </div>

            <div id="groups-filter" class="groups-filter" role="tablist" aria-label="Filter by group">
                <!-- Group tabs rendered here -->
            </div>

            <div id="sessions-list" class="sessions-list" role="list" aria-label="Sessions">
                <!-- Sessions rendered here -->
            </div>

            <div id="empty-state" class="empty-state" hidden>
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 3v18M3 12h18M6 6l12 12M18 6l-12 12"/>
                </svg>
                <h3>No Sessions Yet</h3>
                <p>Click "Add Session" to create your first kilo.ai session</p>
                <button id="empty-add-session" class="btn-primary">Add Your First Session</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <dialog id="new-session-modal" class="modal">
        <form id="new-session-form" method="dialog">
            <h3>New kilo.ai Session</h3>
            <div class="form-group">
                <label for="session-id">Session ID (ses_xxxxxxx)</label>
                <input type="text" id="session-id" name="sessionId" placeholder="ses_abc12345" required pattern="ses_[a-zA-Z0-9]+">
            </div>
            <div class="form-group">
                <label for="session-name">Display Name (optional)</label>
                <input type="text" id="session-name" name="displayName" placeholder="My Session">
            </div>
            <div class="form-group">
                <label for="session-group">Group</label>
                <select id="session-group" name="groupId">
                    <!-- Groups populated dynamically -->
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="cancel-session">Cancel</button>
                <button type="submit" class="btn-primary">Create Session</button>
            </div>
        </form>
    </dialog>

    <dialog id="new-group-modal" class="modal">
        <form id="new-group-form" method="dialog">
            <h3>New Group</h3>
            <div class="form-group">
                <label for="group-name">Group Name</label>
                <input type="text" id="group-name" name="name" placeholder="My Group" required>
            </div>
            <div class="form-group">
                <label>Color</label>
                <div class="color-options" role="radiogroup" aria-label="Group color">
                    <button type="button" class="color-option selected" data-color="#74B9FF" style="background: #74B9FF" aria-label="Blue"></button>
                    <button type="button" class="color-option" data-color="#00D4AA" style="background: #00D4AA" aria-label="Teal"></button>
                    <button type="button" class="color-option" data-color="#A29BFE" style="background: #A29BFE" aria-label="Purple"></button>
                    <button type="button" class="color-option" data-color="#FD79A8" style="background: #FD79A8" aria-label="Pink"></button>
                    <button type="button" class="color-option" data-color="#FF6B6B" style="background: #FF6B6B" aria-label="Red"></button>
                    <button type="button" class="color-option" data-color="#FDCB6E" style="background: #FDCB6E" aria-label="Yellow"></button>
                </div>
                <input type="hidden" id="group-color" name="color" value="#74B9FF">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="cancel-group">Cancel</button>
                <button type="submit" class="btn-primary">Create Group</button>
            </div>
        </form>
    </dialog>

    <template id="group-chip-template">
        <div class="group-chip" role="tab" aria-selected="false" tabindex="0">
            <span class="group-indicator"></span>
            <span class="group-name"></span>
            <button class="group-menu" aria-label="Group options">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1"/>
                    <circle cx="19" cy="12" r="1"/>
                    <circle cx="5" cy="12" r="1"/>
                </svg>
            </button>
        </div>
    </template>

    <template id="session-card-template">
        <div class="session-card" role="listitem" tabindex="0">
            <div class="session-header">
                <div class="session-info">
                    <span class="status-indicator"></span>
                    <span class="session-name"></span>
                    <span class="session-id"></span>
                    <span class="session-group"></span>
                </div>
                <span class="session-status"></span>
            </div>
            <div class="session-actions">
                <button class="btn-icon" data-action="focus" aria-label="Focus" title="Focus">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 9 8.26 12 2"/>
                    </svg>
                </button>
                <button class="btn-icon" data-action="open" aria-label="Open Terminal" title="Open Terminal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-6"/>
                        <polyline points="15 3 9 9 15 15"/>
                    </svg>
                </button>
                <button class="btn-icon danger" data-action="delete" aria-label="Delete" title="Delete">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <template id="session-card-template">
        <div class="session-card" role="listitem" tabindex="0">
            <div class="session-header">
                <div class="session-info">
                    <span class="status-indicator"></span>
                    <span class="session-name"></span>
                    <span class="session-id"></span>
                    <span class="session-group"></span>
                </div>
                <span class="session-status"></span>
            </div>
            <div class="session-actions">
                <button class="btn-icon" data-action="focus" aria-label="Focus" title="Focus">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 9 8.26 12 2"/>
                    </svg>
                </button>
                <button class="btn-icon" data-action="open" aria-label="Open Terminal" title="Open Terminal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-6"/>
                        <polyline points="15 3 9 9 15 15"/>
                    </svg>
                </button>
                <button class="btn-icon danger" data-action="delete" aria-label="Delete" title="Delete">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </div>
    </template>
</body>
</html>
