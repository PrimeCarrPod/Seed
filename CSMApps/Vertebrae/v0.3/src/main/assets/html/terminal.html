<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertebrae Terminal</title>
    <script src="vertebrae-terminal.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100%;
            height: 100vh;
            background: #0d1117;
            color: #e6edf3;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            overflow: hidden;
        }
        #terminal-container { height: 100%; display: flex; flex-direction: column; }
        #terminal { flex: 1; display: flex; flex-direction: column; }
        #terminal-screen {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            outline: none;
        }
        #terminal-screen:focus { outline: none; }
        .terminal-input-line {
            display: flex;
            padding: 8px 10px;
            border-top: 1px solid #30363d;
            background: #161b22;
        }
        .prompt { color: #00d4aa; margin-right: 8px; user-select: none; flex-shrink: 0; }
        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6edf3;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
        }
        .terminal-toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 10px;
            border-top: 1px solid #30363d;
            background: #161b22;
            flex-wrap: wrap;
        }
        .toolbar-btn {
            padding: 6px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: background 0.15s, border-color 0.15s;
        }
        .toolbar-btn:hover { background: #30363d; border-color: #484f58; }
        .toolbar-btn:active { background: #1f2428; }
        .toolbar-select {
            padding: 6px 8px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        /* ANSI colors */
        .ansi-red { color: #ff7b72; }
        .ansi-green { color: #3fb950; }
        .ansi-yellow { color: #d29922; }
        .ansi-blue { color: #58a6ff; }
        .ansi-magenta { color: #a371f7; }
        .ansi-cyan { color: #39c5cf; }
        .ansi-white { color: #e6edf3; }
        .ansi-bold { font-weight: 600; }
        .ansi-underline { text-decoration: underline; }
        .ansi-dim { opacity: 0.7; }
        .ansi-bright-red { color: #ffa198; }
        .ansi-bright-green { color: #56d364; }
        .ansi-bright-yellow { color: #e3b341; }
        .ansi-bright-blue { color: #79c0ff; }
        .ansi-bright-magenta { color: #d2a8ff; }
        .ansi-bright-cyan { color: #56d4dd; }
        .ansi-bright-white { color: #ffffff; }
        /* Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background: #00d4aa;
            animation: blink 1s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
        /* Selection */
        ::selection { background: rgba(88, 166, 255, 0.3); }
        /* Focus visible */
        :focus-visible { outline: 2px solid #00d4aa; outline-offset: 2px; }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        // Initialize terminal when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Get session ID from URL or use default
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId') || 'default';
            
            if (window.initTerminal) {
                window.initTerminal(sessionId);
            }
        });

        // Bridge for native Android communication
        window.handleNativeMessage = function(message) {
            if (window.handleNativeMessageImpl) {
                window.handleNativeMessageImpl(message);
            }
        };
    </script>
</body>
</html>
