  // Icon texture generator
  function buildIconTexture(hexColor, symbol, size) {
    size = size || 64;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var r = size / 2;
    var cx = r, cy = r;
    var grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    var color = '#' + new THREE.Color(hexColor).getHexString();
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, color);
    grad.addColorStop(0.85, color);
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.85, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + (size * 0.42) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(symbol, cx, cy);
    var tex = new THREE.Texture(c);
    tex.needsUpdate = true;
    return tex;
  }

  var ICON_TEXTURES = null;
  function initIconTextures() {

      var s = ICON_SYMBOLS[k];
      ICON_TEXTURES[k] = buildIconTexture(s.hex, s.sym, 48);
    });
  }
